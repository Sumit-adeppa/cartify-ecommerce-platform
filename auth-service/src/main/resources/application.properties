# Application
spring.application.name=auth-service
server.port=8081

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/cartify_auth_db
spring.datasource.username=root
spring.datasource.password=0123456789

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=local-cartify-jwt-secret-change-this-to-a-random-64-byte-secret-123456789

# Internal Service API Key
internal.api-key=local-cartify-internal-key-change-me

# Cookie
cookie.secure=false

# Actuator
management.endpoints.web.exposure.include=health,info